name: Tests
on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun i

            - name: Run Vitest tests
              run: bun run test:unit

